<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <!-- Makes the website responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>React & MongoDB Quiz</title>

    <!-- Connect CSS file -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="quiz-container">

        <!-- Quiz Heading -->
        <div class="header">
            <h1>React & MongoDB Quiz</h1>
            <p>Test your basic knowledge</p>
        </div>

        <!-- Progress -->
        <div class="progress-section">
            <span id="question-number">Question 1 of 10</span>
            <span id="score">Score: 0</span>
        </div>

        <!-- Question -->
        <div class="question-box">
            <h2 id="question">Question will appear here</h2>
        </div>

        <!-- Answer Buttons -->
        <div id="answer-buttons" class="answer-buttons">
            <!-- Buttons will be created using JavaScript -->
        </div>

        <!-- Next Button -->
        <button id="next-button" class="next-button">
            Next Question
        </button>

    </div>

    <!-- Result Box -->
    <div id="result-box" class="result-box">

        <h1>Quiz Completed!</h1>

        <p id="final-score">
            Your Score: 0/10
        </p>

        <button id="restart-button">
            Restart Quiz
        </button>

    </div>

    <!-- Connect JavaScript -->
    <script src="script.js"></script>

</body>

</html>
